# Shared by the three kiosk sites (installed as /etc/nginx/snippets/kiosk-common.conf).

server_tokens off;
include /etc/nginx/snippets/kiosk-headers.conf;

# Photos and logos: straight from disk. Each upload has its own address, so a file never changes.
location /api/media/files/ {
    alias __MEDIA_DIR__/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/kiosk-headers.conf;
    # Only image files are ever served from here.
    location ~* \.(jpg|png|webp|avif)$ { }
    location ~ . { return 404; }
}

# A photo upload, at the signed address the back office got (8 MB at most, checked again by the API).
location /api/media/upload/ {
    client_max_body_size 9m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:__API_PORT__;
    include /etc/nginx/snippets/kiosk-proxy.conf;
}

location /api/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:__API_PORT__;
    include /etc/nginx/snippets/kiosk-proxy.conf;
}
