# Shared by the three kiosk sites (installed as /etc/nginx/snippets/kiosk-common.conf).

server_tokens off;
include /etc/nginx/snippets/kiosk-headers.conf;

# Photos and logos: straight from disk. Each upload has its own address, so a file never changes.
location /api/media/files/ {
    alias __MEDIA_DIR__/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/kiosk-headers.conf;
    # Only photos and videos are ever served from here (videos can be played from any point: ranges work).
    location ~* \.(jpg|png|webp|avif|mp4|webm)$ { }
    location ~ . { return 404; }
}

# A photo or video upload, at the signed address the back office got (photos 8 MB, videos 50 MB; the API checks
# the exact limit for the type).
location /api/media/upload/ {
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:__API_PORT__;
    include /etc/nginx/snippets/kiosk-proxy.conf;
}

location /api/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:__API_PORT__;
    include /etc/nginx/snippets/kiosk-proxy.conf;
}
