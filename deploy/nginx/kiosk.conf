# The screens customers use. https is added by certbot (it edits this file once).
server {
    listen 80;
    listen [::]:80;
    server_name __KIOSK_DOMAIN__;

    include /etc/nginx/snippets/kiosk-common.conf;

    # The app's own script and style files: from disk, cached for good (their names change with each build).
    location /_next/static/ {
        alias __APP_ROOT__/current/kiosk/apps/kiosk/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/kiosk-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:__KIOSK_PORT__;
        include /etc/nginx/snippets/kiosk-proxy.conf;
    }
}
