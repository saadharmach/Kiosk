# The restaurants' back office: plain files, no program behind them except the API. https is added by certbot (it edits this file once).
server {
    listen 80;
    listen [::]:80;
    server_name __BACKOFFICE_DOMAIN__;

    root __APP_ROOT__/current/backoffice;
    index index.html;
    include /etc/nginx/snippets/kiosk-common.conf;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/kiosk-headers.conf;
    }

    location / {
        # /accept-invite is the file accept-invite.html
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/kiosk-headers.conf;
    }

    error_page 404 /404.html;
}
